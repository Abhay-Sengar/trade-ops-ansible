---
- name: Apply low-latency sysctl parameters
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/99-trade-ops.conf
    sysctl_set: true
    reload: true
    state: present
  loop: "{{ kernel_tuning_sysctls | dict2items }}"

- name: Apply best-effort sysctls (skip if key absent in this kernel/VM)
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/99-trade-ops.conf
    sysctl_set: true
    reload: true
    state: present
  loop: "{{ kernel_tuning_sysctls_best_effort | dict2items }}"
  failed_when: false

- name: Configure CPU-isolation parameters on the kernel command line
  ansible.builtin.lineinfile:
    path: /etc/default/grub
    regexp: '^GRUB_CMDLINE_LINUX_DEFAULT='
    line: 'GRUB_CMDLINE_LINUX_DEFAULT="{{ kernel_tuning_cmdline_params | join(" ") }}"'
    backup: true
  notify:
    - Update grub
    - Reboot required

- name: Check whether the CPU frequency governor is exposed
  ansible.builtin.stat:
    path: /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor
  register: cpufreq_stat

- name: Set CPU governor to performance (only if cpufreq is available)
  ansible.builtin.shell: |
    for g in /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor; do
      echo performance > "$g"
    done
  when: cpufreq_stat.stat.exists
  changed_when: true

- name: Note that cpufreq is not exposed (expected inside a VM)
  ansible.builtin.debug:
    msg: >-
      cpufreq/scaling_governor not present — governor control is a bare-metal/BIOS
      step. Skipping (expected in VirtualBox).
  when: not cpufreq_stat.stat.exists

- name: Collect service facts
  ansible.builtin.service_facts:

- name: Disable irqbalance so IRQs are not migrated onto isolated cores
  ansible.builtin.systemd:
    name: irqbalance
    state: stopped
    enabled: false
  when: "'irqbalance.service' in ansible_facts.services"

- name: Read effective kernel command line
  ansible.builtin.command: cat /proc/cmdline
  register: cmdline_now
  changed_when: false

- name: Show current kernel command line (reflects new params only AFTER reboot)
  ansible.builtin.debug:
    var: cmdline_now.stdout
